name: contract-drift

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: authoritative OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fugue-web
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout authoritative Fugue contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: yym68686/fugue
          ref: main
          path: .contract-source/fugue
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test on the production Node.js version
        run: npm test

      - name: Check authoritative contract drift
        env:
          FUGUE_OPENAPI_SOURCE: ${{ github.workspace }}/.contract-source/fugue/openapi/openapi.yaml
        run: npm run contract:check

  github-app-postgres:
    name: PostgreSQL integration regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: github_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify durable queue, account holds, and password signup
        env:
          FUGUE_GITHUB_TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/github_app_test
        run: node --import ./tests/register-alias.mjs --test tests/github-app-postgres.test.ts tests/workspace-access-hold.test.ts tests/password-registration-postgres.test.ts
