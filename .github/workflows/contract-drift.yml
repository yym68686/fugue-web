name: contract-drift

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: authoritative OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fugue-web
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout authoritative Fugue contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: yym68686/fugue
          ref: main
          path: .contract-source/fugue
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check authoritative contract drift
        env:
          FUGUE_OPENAPI_SOURCE: ${{ github.workspace }}/.contract-source/fugue/openapi/openapi.yaml
        run: npm run contract:check
